name: Android reference
on:
  push:
    branches: [main]
    paths: ['android-reference/**', '.github/workflows/android-reference.yml']
  pull_request:
    paths: ['android-reference/**', '.github/workflows/android-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-reference-${{ github.ref }}
  cancel-in-progress: true
env:
  API: '36'
  ARCH: x86_64
jobs:
  host-tests:
    name: Host tests (policy, attestations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: bash android-reference/scripts/test-host.sh
  emulator-scenarios:
    name: Emulator scenarios (AOSP ${{ matrix.api }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '36'
            arch: x86_64
    env:
      API: ${{ matrix.api }}
      ARCH: ${{ matrix.arch }}
      HEADLESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-${{ matrix.api }} build-tools;36.0.0 emulator system-images;android-${{ matrix.api }};default;${{ matrix.arch }}
      - name: Build, boot the AOSP image, install the coordinator and notaries, run every scenario
        run: bash android-reference/scripts/ci.sh
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-api${{ matrix.api }}-${{ matrix.arch }}
          path: |
            android-reference/out/scenarios/
            android-reference/out/build-info.txt
            android-reference/out/notary-server.log
            android-reference/out/emulator.log
          if-no-files-found: warn
